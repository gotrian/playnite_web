services:
  db:
    image: postgres:${POSTGRES_VERSION}
    environment:
      - POSTGRES_USER=${DB_USER:-playnite}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:${MQTT_VERSION}
    volumes:
      - mqtt_config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    restart: unless-stopped

  playnite-web:
    image: ghcr.io/andrew-codes/playnite-web-app:${PLAYNITE_WEB_VERSION}
    ports:
    - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    environment:
      - PORT=${APP_PORT:-3000}
      - HOST=${APP_HOST:-localhost}
      - DATABASE_URL=postgres://${DB_USER:-playnite}:${DB_PASSWORD}@db:5432/games?schema=public&pgbouncer=true&connection_limit=${DB_CONNECTION_LIMIT:-12}
      - SECRET=${APP_SECRET}
      - DISABLE_CSP=${DISABLE_CSP:-false}
      - CSP_ORIGINS=${CSP_ORIGINS}
      - ADDITIONAL_ORIGINS=${ADDITIONAL_ORIGINS}
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - COVER_ART_PATH=/opt/playnite-web/game-assets/cover-art
    volumes:
      - game-assets:/opt/playnite-web-app/game-assets/cover-art
    depends_on:
      - db
      - mqtt
    restart: unless-stopped

  playnite-web-sync-library-processor:
    image: ghcr.io/andrew-codes/sync-library-processor:${PLAYNITE_SYNC_LIBRARY_PROCESSOR_VERSION}
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - DATABASE_URL=postgres://${DB_USER:-playnite}:${DB_PASSWORD}@db:5432/games?schema=public
      - PORT=${PROCESSOR_PORT:-3001}
      - COVER_ART_PATH=/opt/playnite-web/game-assets/cover-art
    volumes:
      - game-assets:/opt/playnite-web/game-assets/cover-art
    depends_on:
      - playnite-web
    restart: unless-stopped

volumes:
  game-assets:
  mqtt_config:
  mqtt_data:
  mqtt_log:
  db_data: